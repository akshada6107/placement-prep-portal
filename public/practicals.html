<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practicals demo</title>

  <!-- Practical 3: INTERNAL CSS (a <style> block inside the HTML file) -->
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 24px auto; padding: 0 16px; background: #fafaf9; color: #1f2937; }
    h1 { color: #0f766e; }
    li.done { text-decoration: line-through; color: #9ca3af; }
    #message { color: #d97706; }
  </style>
</head>
<body>
  <header>
    <h1>Practicals demo</h1>
    <!-- Practical 3: INLINE CSS (style attribute on one element) -->
    <p style="color: #4b5563;">Plain HTML + JavaScript examples (no React).</p>
    <a href="/">Back to the portal</a>
  </header>

  <main>
    <!-- Practical 11: DOM manipulation + events -->
    <section>
      <h2>Topics to revise</h2>
      <input id="topicInput" placeholder="Type a topic">
      <button id="addBtn">Add topic</button>
      <p id="message"></p>
      <ul id="topicList"></ul>
    </section>

    <!-- Practical 6: array functions -->
    <section>
      <h2>Quiz scores (array functions)</h2>
      <p>Scores: <span id="scores"></span></p>
      <button id="passBtn">Show scores of 3 or more (filter)</button>
      <button id="doubleBtn">Show scores out of 10 (map)</button>
      <p>Total: <span id="total"></span> (reduce)</p>
      <p id="arrayOutput"></p>
    </section>
  </main>

  <!-- Practical 6: the JavaScript lives in a separate linked file -->
  <script src="practicals.js"></script>
</body>
</html>
